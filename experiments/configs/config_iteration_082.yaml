augmentation:
  base:
    normalize:
      mean:
      - 0.485
      - 0.456
      - 0.406
      std:
      - 0.229
      - 0.224
      - 0.225
    resize:
    - 224
    - 224
  rare_class:
    enabled: false
data:
  images_dir: ./ChestX-ray14/images224
  test_csv: ./ChestX-ray14/test_data.csv
  train_csv: ./ChestX-ray14/train_data.csv
data_split:
  method: GroupShuffleSplit
  random_state: 42
  train_ratio: 0.8
  val_ratio: 0.2
evaluation:
  metrics:
  - AUC
  - Accuracy
  - Specificity
  - Recall
  - Precision
  - Sensitivity
  - F1_Score
  threshold: 0.5
  threshold_optimization: false
hardware:
  device: auto
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 2
logging:
  log_interval: 300
  save_model: true
  save_results: true
loss:
  alpha: 0.75
  class_frequencies:
  - 0.0342
  - 0.031
  - 0.1641
  - 0.0028
  - 0.2451
  - 0.0712
  - 0.078
  - 0.1424
  - 0.0653
  - 0.0417
  - 0.0176
  - 0.0208
  - 0.0284
  - 0.0575
  gamma: 3.0
  type: FocalLoss
  use_class_weights: true
metadata:
  config_version: '1.0'
  created_at: '2026-01-23 14:03:47'
  description: 'PHASE 1: Exact reproduction of iteration 12 (FROZEN CONFIG)'
  iteration: 82
  note: DO NOT MODIFY - This config must match iteration 12 exactly
  parent_config: iteration_012/config.yaml
  phase: PHASE_1_REPRODUCE
model:
  architecture: ModifiedDenseNetWithDropOut
  backbone: densenet121
  dropout_rate: 0.3
  num_classes: 14
  pretrained: true
  use_additional_features: false
training:
  batch_size: 64
  early_stopping:
    enabled: false
  learning_rate: 0.0005
  num_epochs: 50
  num_workers: 8
  optimizer:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    type: Adam
    weight_decay: 0.0
  scheduler:
    factor: 0.5
    min_lr: 1.0e-05
    mode: min
    patience: 5
    type: ReduceLROnPlateau
  use_mixed_precision: false
