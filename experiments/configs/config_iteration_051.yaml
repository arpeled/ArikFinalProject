metadata:
  config_version: '1.0'
  description: Baseline configuration from v1.1 implementation
  created_at: '2026-01-07 07:05:39'
  iteration: 51
  parent_config: config_iteration_050.yaml
model:
  architecture: ModifiedDenseNetWithDropOut
  backbone: densenet121
  num_classes: 14
  use_additional_features: true
  dropout_rate: 0.3
  pretrained: true
training:
  batch_size: 64
  learning_rate: 0.0001
  num_epochs: 50
  num_workers: 8
  use_mixed_precision: false
  optimizer:
    type: Adam
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.0
  scheduler:
    type: ReduceLROnPlateau
    mode: min
    factor: 0.5
    patience: 5
    min_lr: 1.0e-05
  early_stopping:
    enabled: true
    monitor: val_f1        # CRITICAL: Monitor F1, not loss!
    mode: max              # Maximize F1
    patience: 10           # Increased from 5
    min_delta: 0.001       # Fixed: 0.1% for F1 scale (was 0.01 = 1%)
    warmup_epochs: 15      # Increased from 5 for stability
loss:
  type: FocalLoss
  gamma: 3.0
  use_class_weights: true
  class_frequencies:
  - 0.0342
  - 0.031
  - 0.1641
  - 0.0028
  - 0.2451
  - 0.0712
  - 0.078
  - 0.1424
  - 0.0653
  - 0.0417
  - 0.0176
  - 0.0208
  - 0.0284
  - 0.0575
  alpha: 0.75
augmentation:
  base:
    resize:
    - 224
    - 224
    normalize:
      mean:
      - 0.485
      - 0.456
      - 0.406
      std:
      - 0.229
      - 0.224
      - 0.225
  rare_class:
    enabled: true
    rotation_degrees: 10
    horizontal_flip_prob: 0.7
    affine_translate:
    - 0.05
    - 0.05
    color_jitter:
      brightness: 0.2
      contrast: 0.2
    thresholds:
      Hernia: 0.003
      Pneumonia: 0.01
      Fibrosis: 0.012
      Edema: 0.016
      Emphysema: 0.018
      Cardiomegaly: 0.02
      Pleural_Thickening: 0.025
      Consolidation: 0.035
      Pneumothorax: 0.045
data_split:
  method: GroupShuffleSplit
  train_ratio: 0.8
  val_ratio: 0.2
  random_state: 42
data:
  train_csv: ./ChestX-ray14/train_data.csv
  test_csv: ./ChestX-ray14/test_data.csv
  images_dir: ./ChestX-ray14/images224
evaluation:
  threshold: auto
  metrics:
  - AUC
  - Accuracy
  - Specificity
  - Recall
  - Precision
  - Sensitivity
  - F1_Score
  threshold_optimization: per_class_f1_score
  threshold_optimization_metric: f1_score
hardware:
  device: auto
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
logging:
  log_interval: 300
  save_model: true
  save_results: true
reasoning: The model appears to be overfitting as the validation loss is higher than
  the training loss. A lower learning rate may slow down the model's learning and
  improve its generalization to the validation data.
