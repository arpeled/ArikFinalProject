metadata:
  config_version: '1.0'
  description: "Soften FocalLoss imbalance handling + Fix early_stopping to monitor val_f1 (from iteration 57 AI analysis)"
  created_at: '2026-01-08 21:40:39'
  iteration: 60
  parent_config: auto_improvement_runs/iteration_058/config.yaml
model:
  architecture: ModifiedDenseNetWithDropOut
  backbone: densenet121
  num_classes: 14
  use_additional_features: true
  dropout_rate: 0.3
  pretrained: true
training:
  batch_size: 64
  learning_rate: 0.0005
  num_epochs: 50
  num_workers: 8
  use_mixed_precision: false
  optimizer:
    type: Adam
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.0
  scheduler:
    type: ReduceLROnPlateau
    mode: min
    factor: 0.5
    patience: 5
    min_lr: 1.0e-05
  early_stopping:
    enabled: true
    monitor: val_f1
    mode: max
    patience: 10
    min_delta: 0.001
    warmup_epochs: 15
loss:
  type: FocalLoss
  gamma: 2.0
  use_class_weights: false
  class_frequencies:
  - 0.0342
  - 0.031
  - 0.1641
  - 0.0028
  - 0.2451
  - 0.0712
  - 0.078
  - 0.1424
  - 0.0653
  - 0.0417
  - 0.0176
  - 0.0208
  - 0.0284
  - 0.0575
  alpha: 0.7
augmentation:
  base:
    resize:
    - 224
    - 224
    normalize:
      mean:
      - 0.485
      - 0.456
      - 0.406
      std:
      - 0.229
      - 0.224
      - 0.225
  rare_class:
    enabled: true
    rotation_degrees: 10
    horizontal_flip_prob: 0.7
    affine_translate:
    - 0.05
    - 0.05
    color_jitter:
      brightness: 0.2
      contrast: 0.2
    thresholds:
      Hernia: 0.003
      Pneumonia: 0.01
      Fibrosis: 0.012
      Edema: 0.016
      Emphysema: 0.018
      Cardiomegaly: 0.02
      Pleural_Thickening: 0.025
      Consolidation: 0.035
      Pneumothorax: 0.045
data_split:
  method: GroupShuffleSplit
  train_ratio: 0.8
  val_ratio: 0.2
  random_state: 42
data:
  train_csv: ./ChestX-ray14/train_data.csv
  test_csv: ./ChestX-ray14/test_data.csv
  images_dir: ./ChestX-ray14/images224
evaluation:
  threshold: auto
  metrics:
  - AUC
  - Accuracy
  - Specificity
  - Recall
  - Precision
  - Sensitivity
  - F1_Score
  threshold_optimization: per_class_f1_score
  threshold_optimization_metric: f1_score
hardware:
  device: auto
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
logging:
  log_interval: 300
  save_model: true
  save_results: true
reasoning: "F1 has plateaued around 0.27 while AUC continues to improve, indicating that the model's score distributions are good but the loss weighting and decision rule are misaligned with F1. Current FocalLoss uses gamma=3.0, alpha=0.75, and use_class_weights=true with frequency-based weights, which strongly over-emphasizes positives for rare classes. This is causing extreme false-positive rates for labels like Hernia (Recall=1.0 but Precision=0.002, 20k+ FPs), dragging down macro F1 and precision. The focused task is to soften imbalance handling: reduce gamma to 2.0 and alpha to 0.7, and disable static class weights so that focal loss remains but with less extreme positive emphasis. This should reduce FPs for very rare labels, improving precision and macro F1 while preserving most of the recall gains. Early stopping is also aligned to val_f1 (monitor=max, patience=10, min_delta=0.001, warmup=15) so training optimizes the primary metric rather than val_loss. (Based on successful AI analysis from iteration 57)"
