metadata:
  config_version: '1.0'
  description: Soften FocalLoss imbalance handling + Fix early_stopping to monitor
    val_f1 (from iteration 57 AI analysis)
  created_at: '2026-01-10 05:30:13'
  iteration: 64
  parent_config: config_iteration_062.yaml
model:
  architecture: ModifiedDenseNetWithDropOut
  backbone: densenet121
  num_classes: 14
  use_additional_features: true
  dropout_rate: 0.5
  pretrained: true
training:
  batch_size: 64
  learning_rate: 0.0001
  num_epochs: 35
  num_workers: 8
  use_mixed_precision: false
  optimizer:
    type: Adam
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.01
  scheduler:
    type: ReduceLROnPlateau
    mode: min
    factor: 0.5
    patience: 5
    min_lr: 1.0e-05
  early_stopping:
    enabled: true
    monitor: val_f1
    mode: max
    patience: 10
    min_delta: 0.001
    warmup_epochs: 15
loss:
  type: FocalLoss
  gamma: 2.0
  use_class_weights: false
  class_frequencies:
  - 0.0342
  - 0.031
  - 0.1641
  - 0.0028
  - 0.2451
  - 0.0712
  - 0.078
  - 0.1424
  - 0.0653
  - 0.0417
  - 0.0176
  - 0.0208
  - 0.0284
  - 0.0575
  alpha: 0.7
augmentation:
  base:
    resize:
    - 224
    - 224
    normalize:
      mean:
      - 0.485
      - 0.456
      - 0.406
      std:
      - 0.229
      - 0.224
      - 0.225
    additional_transforms:
      random_rotation: 15
      random_horizontal_flip: 0.5
      color_jitter:
        brightness: 0.3
        contrast: 0.3
        saturation: 0.1
      gaussian_blur: 0.2
  rare_class:
    enabled: true
    rotation_degrees: 10
    horizontal_flip_prob: 0.7
    affine_translate:
    - 0.05
    - 0.05
    color_jitter:
      brightness: 0.2
      contrast: 0.2
    thresholds:
      Hernia: 0.003
      Pneumonia: 0.01
      Fibrosis: 0.012
      Edema: 0.016
      Emphysema: 0.018
      Cardiomegaly: 0.02
      Pleural_Thickening: 0.025
      Consolidation: 0.035
      Pneumothorax: 0.045
data_split:
  method: GroupShuffleSplit
  train_ratio: 0.8
  val_ratio: 0.2
  random_state: 42
data:
  train_csv: ./ChestX-ray14/train_data.csv
  test_csv: ./ChestX-ray14/test_data.csv
  images_dir: ./ChestX-ray14/images224
evaluation:
  threshold: auto
  metrics:
  - AUC
  - Accuracy
  - Specificity
  - Recall
  - Precision
  - Sensitivity
  - F1_Score
  threshold_optimization: per_class_f1_score
  threshold_optimization_metric: f1_score
hardware:
  device: auto
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
logging:
  log_interval: 300
  save_model: true
  save_results: true
reasoning: "F1 has plateaued at 0.27 for 10+ iterations while overfitting became severe\
  \ (val_loss 2735x higher than train_loss). This indicates the model memorizes training\
  \ data but can't generalize. The task focuses on AGGRESSIVE REGULARIZATION: (1)\
  \ Increase dropout from 0.3\u21920.5 to prevent feature co-adaptation, (2) Add strong\
  \ weight decay (0.01) to penalize large weights, (3) Lower learning rate to 0.0001\
  \ for more stable training, (4) Add comprehensive data augmentation including rotation,\
  \ color jitter, and Gaussian blur, (5) Introduce label smoothing (0.1) and mixup\
  \ (0.2) for better generalization. This differs from previous iterations that focused\
  \ on loss function tuning - we're now addressing the core overfitting issue that's\
  \ preventing F1 improvements. Goal: Reduce val_loss to <0.05 while maintaining F1\
  \ \u22650.25."
training_regularization:
  label_smoothing: 0.1
  mixup_alpha: 0.2
