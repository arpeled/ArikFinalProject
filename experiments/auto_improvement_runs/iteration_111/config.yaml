metadata:
  config_version: '1.0'
  description: SMOTE_HEAD - Feature-space SMOTE for Hernia, ratio=8x (final probe)
  created_at: '2026-02-04'
  iteration: 111
  parent_iteration: 91
  parent_config: auto_improvement_runs/iteration_091/config.yaml
  backbone_source: 12
  phase: SMOTE_HEAD
  note: Feature-space SMOTE targeting Hernia with sampling_ratio=8 (probe 2 of 2)
  anchor_iteration: 91
  smote_probe_count: 2
model:
  architecture: ModifiedDenseNetWithDropOut
  backbone: densenet121
  num_classes: 14
  use_additional_features: true
  dropout_rate: 0.3
  pretrained: true
  head:
    type: mlp
    hidden_features: 1024
    dropout: 0.2
    activation: relu
training:
  batch_size: 64
  learning_rate: 0.0001
  num_epochs: 50
  num_workers: 8
  use_mixed_precision: false
  freeze_backbone: true
  optimizer:
    type: Adam
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.0001
  scheduler:
    type: ReduceLROnPlateau
    mode: max
    factor: 0.5
    patience: 3
    min_lr: 1.0e-06
  early_stopping:
    enabled: true
    monitor: val_macro_auc
    mode: max
    patience: 5
    min_delta: 0.001
    warmup_epochs: 3
loss:
  type: BCE
  use_class_weights: false
auc_improvement:
  enabled: false
smote:
  enabled: true
  mode: feature_space
  target_class: Hernia
  sampling_ratio: 8
  k_neighbors: 3
  seed: 42
augmentation:
  base:
    resize:
    - 224
    - 224
    normalize:
      mean:
      - 0.485
      - 0.456
      - 0.406
      std:
      - 0.229
      - 0.224
      - 0.225
  rare_class:
    enabled: false
data_split:
  method: GroupShuffleSplit
  train_ratio: 0.8
  val_ratio: 0.2
  random_state: 42
data:
  train_csv: ./ChestX-ray14/train_data.csv
  test_csv: ./ChestX-ray14/test_data.csv
  images_dir: ./ChestX-ray14/images224
evaluation:
  threshold: auto
  metrics:
  - AUC
  - Accuracy
  - Specificity
  - Recall
  - Precision
  - Sensitivity
  - F1_Score
  threshold_optimization: per_class_f1_score
  threshold_optimization_metric: f1_score
hardware:
  device: auto
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
logging:
  log_interval: 100
  save_model: true
  save_results: true
