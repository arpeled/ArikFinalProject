metadata:
  config_version: '1.0'
  description: HERNIA_THRESHOLD_STABILIZATION - Constrained threshold optimization
  created_at: '2026-02-07'
  iteration: 130
  parent_iteration: 129
  parent_config: config_iteration_122_hernia_oversample.yaml
  backbone_source: 89
  phase: HERNIA_THRESHOLD_STABILIZATION
  role_override: true
  anchor_iteration: 122
  allow_phase_override: true
  note: >
    Decision stabilization experiment. Preserves Hernia oversampling from iter 122
    but disables uncontrolled per-class F1 threshold optimization.
    Only Hernia gets constrained threshold optimization (min precision 2% or max FP 500).
    All other classes use fixed threshold 0.5.
    Goal: Reduce FP explosion while preserving Hernia TP > 0.
model:
  architecture: ModifiedDenseNetWithDropOut
  backbone: densenet121
  num_classes: 14
  use_additional_features: true
  dropout_rate: 0.3
  pretrained: true
  freeze_backbone: true
  head:
    type: mlp
    layers: [1024, 256]
    dropout: 0.2
    activation: relu
training:
  batch_size: 64
  learning_rate: 0.0001
  num_epochs: 10
  num_workers: 8
  use_mixed_precision: false
  freeze_backbone: true
  optimizer:
    type: Adam
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.0001
  scheduler:
    type: ReduceLROnPlateau
    mode: max
    factor: 0.5
    patience: 3
    min_lr: 1.0e-06
  early_stopping:
    enabled: true
    monitor: val_macro_auc
    mode: max
    patience: 5
    min_delta: 0.001
    warmup_epochs: 2
loss:
  type: BCE
  use_class_weights: false
auc_improvement:
  enabled: false
smote:
  enabled: false
# ============================================================
# HERNIA OVERSAMPLING - Keep from iteration 122
# ============================================================
sampling:
  hernia_oversample:
    enabled: true
    factor: 10
# ============================================================
# THRESHOLD STABILIZATION - NEW
# ============================================================
thresholds:
  # Disable uncontrolled per-class F1 optimization
  disable_optimization: false
  # Enable Hernia-only constrained optimization
  optimize_hernia_only: true
  # Default threshold for all non-Hernia classes
  default_threshold: 0.5
  # Constraints for Hernia threshold selection
  hernia_constraint:
    min_precision: 0.02
    max_fp: 500
augmentation:
  base:
    resize:
    - 224
    - 224
    normalize:
      mean:
      - 0.485
      - 0.456
      - 0.406
      std:
      - 0.229
      - 0.224
      - 0.225
  rare_class:
    enabled: false
data_split:
  method: GroupShuffleSplit
  train_ratio: 0.8
  val_ratio: 0.2
  random_state: 42
data:
  train_csv: ./ChestX-ray14/train_data.csv
  test_csv: ./ChestX-ray14/test_data.csv
  images_dir: ./ChestX-ray14/images224
evaluation:
  threshold: auto
  metrics:
  - AUC
  - Accuracy
  - Specificity
  - Recall
  - Precision
  - Sensitivity
  - F1_Score
  # Note: threshold_optimization setting is now controlled by 'thresholds' block above
  threshold_optimization: per_class_f1_score
  threshold_optimization_metric: f1_score
hardware:
  device: auto
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
logging:
  log_interval: 100
  save_model: true
  save_results: true
