metadata:
  config_version: '1.0'
  description: REPRESENTATION_FINETUNE - Partial backbone fine-tuning for Hernia separability
  created_at: '2026-02-05'
  iteration: 121
  phase: REPRESENTATION_FINETUNE
  role_override: true
  anchor_iteration: 89
  parent_iteration: 89
  allow_phase_override: true
  note: >
    Controlled experiment to test whether minimal representation adaptation
    (last DenseNet block only) can enable Hernia separability.
    Starts from iteration 89 weights (best model so far).
    No SMOTE, no Phase 5 logic.
model:
  architecture: ModifiedDenseNetWithDropOut
  backbone: densenet121
  num_classes: 14
  use_additional_features: true
  dropout_rate: 0.3
  pretrained: true
  # Partial backbone fine-tuning: only unfreeze denseblock4 + norm5
  freeze_backbone: false
  unfreeze_last_blocks: 1
  head:
    type: mlp
    layers: [1024, 256]
    dropout: 0.2
    activation: relu
training:
  batch_size: 64
  # Very low learning rate for backbone fine-tuning
  learning_rate: 0.00001
  num_epochs: 5
  num_workers: 8
  use_mixed_precision: false
  freeze_backbone: false
  optimizer:
    type: Adam
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.0001
  scheduler:
    type: ReduceLROnPlateau
    mode: max
    factor: 0.5
    patience: 3
    min_lr: 1.0e-06
  early_stopping:
    enabled: true
    monitor: val_macro_auc
    mode: max
    patience: 5
    min_delta: 0.001
    warmup_epochs: 2
loss:
  type: BCE
  use_class_weights: false
auc_improvement:
  enabled: false
smote:
  enabled: false
augmentation:
  base:
    resize:
    - 224
    - 224
    normalize:
      mean:
      - 0.485
      - 0.456
      - 0.406
      std:
      - 0.229
      - 0.224
      - 0.225
  rare_class:
    enabled: false
data_split:
  method: GroupShuffleSplit
  train_ratio: 0.8
  val_ratio: 0.2
  random_state: 42
data:
  train_csv: ./ChestX-ray14/train_data.csv
  test_csv: ./ChestX-ray14/test_data.csv
  images_dir: ./ChestX-ray14/images224
evaluation:
  threshold: auto
  metrics:
  - AUC
  - Accuracy
  - Specificity
  - Recall
  - Precision
  - Sensitivity
  - F1_Score
  threshold_optimization: per_class_f1_score
  threshold_optimization_metric: f1_score
hardware:
  device: auto
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
logging:
  log_interval: 100
  save_model: true
  save_results: true
