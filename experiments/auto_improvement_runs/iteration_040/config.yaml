# Baseline Configuration for Chest X-Ray Classification
# Updated for Per-Class Threshold Optimization and Improved Sensitivity

metadata:
  config_version: "2.0"
  description: >
    This iteration corrects a major issue where a fixed threshold of 0.5 was applied to all classes.
    Instead, we apply per-class optimized thresholds based on F1-score, which allows the model to
    detect more true positives for imbalanced and low-signal diseases. FocalLoss gamma was increased
    to 3.5 to increase focus on hard samples, and training length was extended to 60 epochs.
    Dropout was reduced to 0.2 to reduce underfitting.
  created_at: "2026-01-03"
  iteration: 40

# Model Architecture
model:
  architecture: "ModifiedDenseNetWithDropOut"  # or "ModifiedDenseNet"
  backbone: "densenet121"
  num_classes: 14
  use_additional_features: true
  dropout_rate: 0.2  # Reduced from 0.3 to reduce underfitting
  pretrained: true

# Training Hyperparameters
training:
  batch_size: 64
  learning_rate: 0.001
  num_epochs: 60  # Extended from 20 to allow better convergence
  num_workers: 8
  use_mixed_precision: false

  # Optimizer settings
  optimizer:
    type: "Adam"
    betas: [0.9, 0.999]
    eps: 1.0e-08
    weight_decay: 0.0

  # Learning rate scheduler
  scheduler:
    type: "ReduceLROnPlateau"
    mode: "min"
    factor: 0.5
    patience: 5
    min_lr: 1.0e-05

  # Early stopping
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.01
    warmup_epochs: 5

# Loss Function Configuration
loss:
  type: "FocalLoss"  # or "WeightedBCE"
  gamma: 3.5  # Increased from 2.0 to focus more on hard examples
  alpha: 0.5  # Balances positive/negative class weighting
  use_class_weights: true
  use_dynamic_weights: true  # Compute weights dynamically based on batch

  # Class frequencies for weight calculation
  class_frequencies:
    - 0.0342  # Cardiomegaly
    - 0.0310  # Emphysema
    - 0.1641  # Effusion
    - 0.0028  # Hernia
    - 0.2451  # Infiltration
    - 0.0712  # Mass
    - 0.0780  # Nodule
    - 0.1424  # Atelectasis
    - 0.0653  # Pneumothorax
    - 0.0417  # Pleural_Thickening
    - 0.0176  # Pneumonia
    - 0.0208  # Fibrosis
    - 0.0284  # Edema
    - 0.0575  # Consolidation

# Data Augmentation
augmentation:
  # Base transform (applied to all samples)
  base:
    resize: [224, 224]
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

  # Rare class augmentation
  rare_class:
    enabled: true
    rotation_degrees: 10
    horizontal_flip_prob: 0.5
    affine_translate: [0.05, 0.05]
    color_jitter:
      brightness: 0.2
      contrast: 0.2

    # Thresholds for rare class detection
    thresholds:
      Hernia: 0.003
      Pneumonia: 0.01
      Fibrosis: 0.012
      Edema: 0.016
      Emphysema: 0.018
      Cardiomegaly: 0.02
      Pleural_Thickening: 0.025
      Consolidation: 0.035
      Pneumothorax: 0.045

# Class Balancing (Oversampling/SMOTE)
# Addresses extreme class imbalance by creating more minority class samples
data_balancing:
  strategy: "none"  # Options: "none", "oversample", "smote"
  target_frequency: 0.05  # Target 5% representation for minority classes
  # Note: Set strategy to "oversample" to enable class balancing
  # This will be suggested by AI when appropriate

# Data Splitting
data_split:
  method: "GroupShuffleSplit"  # Patient-level split
  train_ratio: 0.8
  val_ratio: 0.2
  random_state: 42

# Data Paths
data:
  train_csv: "./ChestX-ray14/train_data.csv"
  test_csv: "./ChestX-ray14/test_data.csv"
  images_dir: "./ChestX-ray14/images224"

# Evaluation Settings
evaluation:
  threshold: auto  # Use optimized per-class thresholds
  threshold_optimization: per_class_f1_score  # Optimize each class threshold for F1
  metrics:
    - "AUC"
    - "Accuracy"
    - "Specificity"
    - "Recall"
    - "Precision"
    - "Sensitivity"
    - "F1_Score"

# Hardware Settings
hardware:
  device: "auto"  # auto, cuda, mps, cpu
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

# Logging
logging:
  log_interval: 300  # batches
  save_model: true
  save_results: true