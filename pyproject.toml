[project]
name = "chest-xray-auto-improvement"
version = "1.0.0"
description = "Auto-improvement pipeline for chest X-ray disease classification using AI-guided hyperparameter optimization"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Arik Peled"}
]

dependencies = [
    # OpenAI API integration
    "openai>=1.0.0",
    # Configuration management
    "pyyaml>=6.0",
    # Data processing
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    # Machine learning
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "scikit-learn>=1.0.0",
    # Image processing
    "Pillow>=9.0.0",
    "seaborn>=0.13.2",
    "imbalanced-learn>=0.12.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

# Note: This is a script-based project, not a distributable package
# No build system needed - just use uv for dependency management

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
